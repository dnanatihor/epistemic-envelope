[project]
name = "epistemic-envelope"
version = "0.1.0"
description = "Separate certified, observed, and AI-inferred claims in data API responses"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastmcp>=2,<3",
  "jsonschema[format-nongpl]>=4.23",
  "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/ovaledge/epistemic-envelope"
Source = "https://github.com/ovaledge/epistemic-envelope"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epienv"]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.11",
  "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["SPEC.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/epienv", "scripts", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
