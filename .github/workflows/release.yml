name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  testpypi:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
      - run: uv python install 3.12
      - run: uv build
      - run: uv publish --publish-url https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
      - run: uv python install 3.12
      - run: uv build
      - run: uv publish
